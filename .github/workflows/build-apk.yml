name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set version variables
        id: version
        run: |
          BASE_VERSION=$(cat VERSION | head -n 1 | tr -d '[:space:]')
          BUILD_NUMBER="${{ github.run_number }}"
          echo "code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "name=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-webview/sazgan-release.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        working-directory: android-webview
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle assembleRelease

      - name: Rename APK
        run: cp android-webview/app/build/outputs/apk/release/app-release.apk sazgan-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sazgan-release-apk
          path: sazgan-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          name: Sazgan v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          files: sazgan-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk
