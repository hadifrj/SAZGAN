<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/c/manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سازگان گستر">
<title>سازگان گستر | مرکز ارتباط مشتریان</title>
<style>
@font-face{font-family:Vazirmatn;src:url('/static/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url('/static/fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;padding:20px}.app{width:min(100%,420px);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.08)}.brand{text-align:center;font-size:25px;font-weight:800;letter-spacing:-.5px}.subtitle{text-align:center;color:#64748b;margin:7px 0 22px;font-size:14px}label{display:block;margin:14px 0 7px;font-size:13px;font-weight:600}input,button{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;font:inherit;font-size:15px}input{border:1px solid #dbe2ea;background:#fff;outline:none}.password-wrap{position:relative}.password-wrap input{padding-left:50px}.password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#64748b;margin:0;padding:0;display:grid;place-items:center;cursor:pointer;border-radius:9px}.password-toggle:hover{background:#f1f5f9;color:#0f172a}.password-toggle:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}.password-toggle svg{width:20px;height:20px;display:block}input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px #eef2ff}button{margin-top:18px;border:0;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}.error{background:#fff1f2;color:#b42318;padding:11px 12px;border-radius:10px;margin:12px 0;font-size:13px}.support{display:block;text-align:center;margin-top:17px;color:#64748b;text-decoration:none;font-size:13px}.support:hover{color:#0f172a}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f8fafc}.app{background:#111827;border-color:#334155;box-shadow:none}.subtitle,.support{color:#94a3b8}input{background:#0f172a;color:#fff;border-color:#334155}.password-toggle{color:#94a3b8}.password-toggle:hover{background:#1e293b;color:#fff}.support:hover{color:#fff}}
</style></head>
<body><main class="app"><div class="brand">سازگان گستر</div><p class="subtitle">مرکز ارتباط مشتریان</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>نام کاربری</label><input name="national_id" inputmode="numeric" autocomplete="username" required autofocus><label>رمز عبور</label><div class="password-wrap"><input id="customer-password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="نمایش رمز عبور" aria-pressed="false" title="نمایش رمز عبور"><svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="m3 3 18 18"/><path d="M10.6 5.1A11.6 11.6 0 0 1 12 5c6.5 0 10 7 10 7a18.2 18.2 0 0 1-3.2 4.2"/><path d="M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div><button type="submit">ورود</button></form><a class="support" href="/support/track">پشتیبانی</a></main><script>(function(){var input=document.getElementById('customer-password');var btn=document.querySelector('.password-toggle');var open=document.getElementById('eye-open');var closed=document.getElementById('eye-closed');if(!input||!btn)return;btn.addEventListener('click',function(){var visible=input.type==='text';input.type=visible?'password':'text';btn.setAttribute('aria-pressed',visible?'false':'true');btn.setAttribute('aria-label',visible?'نمایش رمز عبور':'پنهان کردن رمز عبور');btn.title=visible?'نمایش رمز عبور':'پنهان کردن رمز عبور';open.style.display=visible?'block':'none';closed.style.display=visible?'none':'block';input.focus();});})();</script></body></html>
