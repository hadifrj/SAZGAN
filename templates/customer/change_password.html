<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغییر رمز</title><style>body{font-family:Tahoma;background:#f5f6f8;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(90%,400px);background:#fff;padding:28px;border-radius:24px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border-radius:12px;border:1px solid #ddd}button{background:#7a1f2b;color:#fff;border:0;font-weight:bold}.error{color:#b42318}</style><main class="card"><h2>تغییر اجباری رمز عبور</h2><p>برای امنیت حساب، ابتدا رمز شخصی خود را تعیین کنید.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>رمز فعلی</label><input name="current_password" type="password" required><label>رمز جدید</label><input name="new_password" type="password" minlength="8" required><label>تکرار رمز جدید</label><input name="confirm_password" type="password" minlength="8" required><button>ثبت و ادامه</button></form></main>
