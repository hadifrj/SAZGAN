<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظرسنجی | اپ مشتری</title><style>@font-face{font-family:Vazirmatn;src:url('/static/fonts/Vazirmatn-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:Vazirmatn,Tahoma,sans-serif}.head{background:#fff;padding:18px 16px;border-bottom:1px solid #e7e7e7;display:flex;justify-content:space-between}.head a{color:#666;text-decoration:none;font-size:12px}.wrap{max-width:620px;margin:auto;padding:18px 16px}.box{background:#fff;border:1px solid #e7e7e7;border-radius:18px;padding:18px}.box h1{font-size:17px;margin:0 0 6px}.box p{font-size:12px;color:#777;line-height:1.8}.rating{display:flex;direction:ltr;justify-content:flex-end;gap:8px;margin:18px 0}.rating input{position:absolute;opacity:0}.rating label{width:42px;height:42px;border:1px solid #ddd;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:21px}.rating input:checked+label{background:#171717;color:#fff;border-color:#171717}textarea{width:100%;min-height:100px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;resize:vertical}button{width:100%;margin-top:12px;border:0;border-radius:12px;background:#171717;color:#fff;padding:12px;font:inherit;cursor:pointer}.ok,.err{padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:12px}.ok{background:#eef7f0;color:#28733c}.err{background:#fff0f0;color:#a22}</style></head><body><header class="head"><strong>نظرسنجی</strong><a href="/c/home">بازگشت</a></header><main class="wrap"><form class="box" method="post"><h1>نظر شما برای ما مهم است</h1><p>میزان رضایت خود از خدمات سازگان را ثبت کنید.</p>{% if saved %}<div class="ok">نظر شما با موفقیت ثبت شد.</div>{% endif %}{% if error %}<div class="err">{{ error }}</div>{% endif %}<div class="rating">{% for n in [5,4,3,2,1] %}<input id="r{{n}}" type="radio" name="rating" value="{{n}}" {% if survey and survey.rating==n %}checked{% endif %}><label for="r{{n}}">☆</label>{% endfor %}</div><textarea name="comment" placeholder="اگر پیشنهادی دارید بنویسید...">{{ survey.comment if survey else '' }}</textarea><button type="submit">ثبت نظر</button></form></main></body></html>
