<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گفتگوی جدید | سازگان</title><link rel="stylesheet" href="/static/css/customer-portal.css"><style>.form{max-width:700px;margin:auto;padding:22px}.form h1{margin:0;font-size:21px}.hint{font-size:13px;color:var(--muted);line-height:2}.box{margin:15px 0;padding:13px;border-radius:14px;background:#f8fafc;border:1px solid var(--line);font-size:12px;line-height:1.9}label{font-size:12px;font-weight:700;display:block;margin:14px 0 6px}input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px}textarea{min-height:150px;resize:vertical}.err{padding:10px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:12px}</style></head><body><header class="cp-top"><div class="cp-top-row"><div class="cp-brand">گفتگوی جدید</div><a class="cp-link" href="/c/chats">بازگشت</a></div></header><main class="cp-wrap"><form class="form cp-card" method="post"><h1>گفتگو با پشتیبانی</h1><p class="hint">این بخش فقط برای پرسش و ارتباط با پشتیبانی است و هیچ پرونده خدماتی یا شماره پذیرشی ایجاد نمی‌کند.</p><div class="box">اگر خرابی دستگاه یا سرویس دارید، از کارت‌های «اعلام خرابی» یا «درخواست سرویس» در صفحه خانه استفاده کنید.</div>{% if error %}<div class="err">{{ error }}</div>{% endif %}<label>موضوع</label><input name="subject" placeholder="مثلاً سوال درباره نحوه استفاده" required><label>پیام</label><textarea name="message" required placeholder="پیام خود را بنویسید..."></textarea><button class="cp-btn" style="width:100%;margin-top:16px" type="submit">شروع گفتگو</button></form></main></body></html>
