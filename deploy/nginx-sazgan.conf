# کانفیگ nginx برای سازگان — TLS termination با گواهی self-signed
#
# نصب:
#   1) این فایل رو کپی کن به: /etc/nginx/sites-available/sazgan
#   2) لینک بساز: sudo ln -s /etc/nginx/sites-available/sazgan /etc/nginx/sites-enabled/
#   3) sazgan.crt و sazgan.key رو (که با generate_self_signed_cert.sh ساختی) به مسیر زیر منتقل کن
#      یا مسیر ssl_certificate/ssl_certificate_key رو به همون‌جایی که هستن اشاره بده
#   4) SAZGAN_SERVER_NAME زیر رو با IP یا هاست‌نیم واقعی سرورت جایگزین کن
#   5) sudo nginx -t && sudo systemctl reload nginx
#   6) روی خود اپ فلسک، متغیر محیطی SAZGAN_SESSION_SECURE=1 رو ست کن (کوکی‌ها فقط روی HTTPS ارسال بشن)
#      و ترجیحاً SAZGAN_HOST=127.0.0.1 (waitress فقط لوکال گوش بده، نه رو شبکه)

server {
    listen 80;
    server_name SAZGAN_SERVER_NAME;
    # هدایت همه‌ی ترافیک HTTP به HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name SAZGAN_SERVER_NAME;

    ssl_certificate     /etc/nginx/ssl/sazgan.crt;
    ssl_certificate_key /etc/nginx/ssl/sazgan.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS — به مرورگر می‌گه از این به بعد فقط HTTPS بره سراغ این سایت (۶ ماه)
    # توجه: چون گواهی self-signed هست، اولین بار هر کاربر باید گواهی رو دستی
    # تأیید/نصب کنه؛ بعد از اون HSTS جلوی داون‌گرید به HTTP رو می‌گیره.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    client_max_body_size 55M;   # هماهنگ با MAX_CONTENT_LENGTH اپ (۵۰ مگابایت + کمی حاشیه)

    # فشرده‌سازی پاسخ‌ها
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/xml image/svg+xml application/manifest+json font/woff2;

    # فایل‌های استاتیک مستقیم از دیسک (بدون پروکسی به Flask) — خیلی سریع‌تر
    # مسیر root را با مسیر واقعی نصب سازگان روی سرور جایگزین کنید
    location /static/ {
        alias /opt/sazgan-app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri @app_static;
    }
    location @app_static {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
    }
}
