plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def envVersionCode = System.getenv("APK_VERSION_CODE")
def envVersionName = System.getenv("APK_VERSION_NAME")

android {
    namespace "com.sazgan.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.sazgan.app"
        minSdk 24
        targetSdk 34
        versionCode envVersionCode ? envVersionCode.toInteger() : 1
        versionName envVersionName ?: "1.1"
    }

    signingConfigs {
        release {
            storeFile file("../sazgan-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
