android.useAndroidX=true

# رفع خطای رایج ویندوز: «gradle-fileevents.dll: The specified procedure could not
# be found» هنگام شروع Gradle Daemon. این خطا از سرویس بومی پایش فایل (file-watch)
# می‌آید، نه از کد پروژه؛ خاموش کردنش مشکل را دور می‌زند بدون افت واقعی در بیلد
# یک‌باره (فقط auto-rebuild هنگام تغییر فایل غیرفعال می‌شود که این‌جا لازم نیست).
org.gradle.vfs.watch=false

# پایدارتر شدن دیمون روی ماشین‌های ویندوزی با رم محدود
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
